<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>foot.status</title>
  <meta name="description" content="Les infos et l'actualité des footballeurs du monde entier.">
  <meta name="theme-color" content="#101827">
  <link rel="icon" href="Images/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="Images/icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="Styles/main_style.css">
</head>
<body>

  <!-- Barre du haut -->
  <header class="barre">
    <div class="barre-contenu">
      <a class="logo" href="#">
        <img src="Images/icon.svg" alt="" width="30" height="30">
        <span class="nom-site">foot<span class="point">.</span><span class="status">status</span></span>
      </a>
      <form class="petite-recherche" id="rechercheHaut">
        <input type="search" name="nom" placeholder="Rechercher un joueur">
      </form>
      <button class="bouton-rond" id="boutonParametres" type="button" title="Paramètres">⚙️</button>
    </div>
  </header>

  <!-- Le contenu change selon la page (voir app.ts) -->
  <main id="contenu"></main>

  <!-- Contact -->
  <footer class="pied">
    <h2 data-texte="contact">Nous contacter</h2>
    <p data-texte="contactTexte">Une question, une idée, un joueur manquant ? Écris-nous.</p>
    <p class="mails">
      <a href="mailto:samar.ochi@epitech.eu">✉ samar.ochi@epitech.eu</a>
      <a href="mailto:omar.harrouni2006@gmail.com">✉ omar.harrouni2006@gmail.com</a>
    </p>
    <p class="credit" data-texte="credit">Données joueurs et matchs : TheSportsDB.</p>
  </footer>

  <!-- Fenêtre des paramètres -->
  <div class="fond" id="fond"></div>
  <div class="parametres" id="parametres">
    <div class="parametres-haut">
      <h2 data-texte="parametres">Paramètres</h2>
      <button class="bouton-rond" id="boutonFermer" type="button">✕</button>
    </div>

    <p class="parametres-titre" data-texte="theme">Thème</p>
    <div class="choix">
      <label><input type="radio" name="theme" value="light"><span>☀️ <b data-texte="clair">Clair</b></span></label>
      <label><input type="radio" name="theme" value="dark"><span>🌙 <b data-texte="sombre">Sombre</b></span></label>
      <label><input type="radio" name="theme" value="auto"><span>⚙️ <b data-texte="auto">Auto</b></span></label>
    </div>

    <p class="parametres-titre" data-texte="langue">Langue</p>
    <div class="choix">
      <label><input type="radio" name="langue" value="fr"><span>🇫🇷 Français</span></label>
      <label><input type="radio" name="langue" value="en"><span>🇬🇧 English</span></label>
    </div>
  </div>

  <!-- Le JavaScript (créé à partir des fichiers TypeScript) -->
  <script src="Code/Javascript/traductions.js"></script>
  <script src="Code/Javascript/donnees.js"></script>
  <script src="Code/Javascript/api.js"></script>
  <script src="Code/Javascript/app.js"></script>
</body>
</html>
